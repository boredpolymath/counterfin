name: Bug Report
description: Create a report to help us fix a defect or unexpected behavior
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please ensure no unredacted personal financial data, Social Security Numbers, or medical diagnoses are included in this report.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Navigate to 'Case Registry'
        2. Click on 'Quick-Log Call'
        3. Submit without selecting case
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened under statutory/system rules.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux (Ubuntu/Debian)
        - Linux (Arch/Fedora)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SettleMint Version
      placeholder: "e.g., 0.1.0"
    validations:
      required: true
  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: Privacy Confirmation
      options:
        - label: I confirm this report contains NO unredacted Social Security Numbers, Protected Health Information (PHI), or confidential financial details.
          required: true
