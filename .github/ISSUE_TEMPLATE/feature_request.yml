name: Feature Request
description: Propose a new feature, workflow improvement, or document template
title: "[FEAT]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an enhancement or new functionality for SettleMint. Please verify that requested features respect SettleMint's zero-telemetry and local-first architecture.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific consumer advocacy challenge or workflow friction?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
  - type: checkboxes
    id: architecture-compliance
    attributes:
      label: Architectural Compliance
      options:
        - label: I confirm this feature requires no external telemetry or non-consensual network communication.
          required: true
